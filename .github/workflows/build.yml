# Why this exists: the packaging depends on WebKitGTK/GTK versions from nixpkgs,
# and a nixpkgs bump can break it silently (see NOTES.md, section "Dead ends").
# This builds the package on every push to main and every PR, independent of the update job.
# Caveat: the build fetches the .deb from Anycubic's CDN (fetchurl). If the CDN is down
# or has a bad certificate, this workflow goes red although the repo itself is fine.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned like the update workflow (ubuntu-latest moved to Ubuntu 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build package
        run: nix build .#default -L
